# One LOFO fold: teacher (RGB+depth) -> RGB baseline -> distilled RGB student.
# Everything that varies between runs lives here; copy this file per experiment.
experiment:
  name: unet
  seed: 42
  lofo_family: special          # held-out (test) family: animal | home | special
  roles: [teacher, baseline, student]   # any subset; a student needs the teacher

model:
  architecture: unet            # unet | segformer
  base_channels: 32             # U-Net width (ignored by segformer)
  pretrained: false

data:
  image_size: [384, 576]        # model input (H, W): 0.75x of the 512x768 frames, aspect ratio kept. Use multiples
                                # of 32. [512, 768] is native (no resizing) but costs ~1.8x more compute.
  batch_size: 16
  num_workers: 8                # data decoding is CPU-bound at native size; match your VM's CPU count
  eval_native: true             # score val/test at original resolution, whatever image_size is
  augment:                      # training-only RGB augmentation (horizontal flip is always on); 0 / 1.0 = off
    brightness: 0.2             # RGB brightness x U(0.8, 1.2)
    contrast: 0.2
    saturation: 0.2
    crop_min_scale: 0.75        # crop covers 75-100% of the frame and always keeps the whole anomaly

teacher:                        # depth perturbation used only while training the teacher
  depth_noise_std_m: 1.0
  depth_dropout_probability: 0.3
  depth_dropout_fraction: 0.2

student:
  kd_weight: 0.5
  temperature: 2.0

training:
  epochs: 20
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  # Settled recipe (defaults shown; remove any line to use the default):
  warmup_frac: 0.05
  grad_clip: 1.0
  ema_decay: 0.998              # 0 disables EMA weights
  smooth_window: 3
  select_min_frac: 0.5
  pos_share_within: 0.7
  focal_alpha: 0.25
  focal_gamma: 2.0
  amp: true
