# One complete teacher -> RGB baseline -> distilled RGB student experiment.
# Replace lofo_family with an exact family identifier from lofo_splits/.
experiment:
  name: unet_bce
  seed: 42
  lofo_family: special

model:
  architecture: unet
  base_channels: 32
  pretrained: false

data:
  image_size: [256, 256]
  batch_size: 16
  num_workers: 2

teacher:
  depth_noise_std_m: 1.0
  depth_dropout_probability: 0.3
  depth_dropout_fraction: 0.2

student:
  kd_weight: 0.5
  temperature: 2.0

training:
  epochs: 20
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  supervised_loss: bce_dice

evaluation:
  threshold: 0.5
